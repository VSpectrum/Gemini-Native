[package]
name = "gemini_native_client"
version = "0.1.0"
edition = "2021"

[package.metadata.bundle]
name = "Gemini Native Client"
identifier = "com.vspectrum.gemini-native-client"
icon = [
    "assets/32x32.png",
    "assets/128x128.png",
    "assets/256x256.png",
    "assets/512x512.png",
    "assets/512x512@2x.png",
]


[dependencies]
# GUI Framework
# Default eframe features include accesskit (a screen-reader backend) and winit's
# Wayland client-side decoration stack. Neither is used here. x11/wayland stay enabled
# so a Linux build still opens a window; those crates are target-gated and are not
# compiled into the macOS binary. VoiceOver support is the thing this turns off.
eframe = { version = "0.27.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.27.0"

# Tiling engine for tmux-style panes (Aligned with egui 0.27)
egui_tiles = { version = "0.8.0", features = ["serde"] }

# Markdown. Do not enable `better_syntax_highlighting`: that feature's real name
# pulls in syntect and deserializes every syntax and theme (several MB). The
# `syntect` feature string is not a feature of this crate. egui_extras already
# highlights the common languages with a small built-in lexer.
egui_commonmark = "0.14.0"

# Async runtime for background processes.
# The UI pins the scheduler to one worker. `net` is the Gemini connection.
# `io-util` and `sync` cover cancellation and the warm client.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "net"] }

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui_extras = { version = "0.27.0", features = ["image", "file"] }
# Only used to enable decoders for egui_extras' image loader. The default feature set pulls in
# rayon (spawns a thread per core on first JPEG decode), EXR, TIFF, AVIF, etc.
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5.4.4"
regex = "1"
sha1 = "0.10"
base64 = "0.22"
# Chrome TLS and HTTP/2 fingerprint. A plain HTTP client is declined by Gemini.
wreq = { version = "0.16", features = ["cookies", "form", "query", "stream", "gzip", "brotli", "deflate", "zstd"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
wreq-util = "0.2"
# Firefox stores session cookies in SQLite. `bundled` keeps the app off the system library.
rusqlite = { version = "0.32", features = ["bundled"] }

# Optional, user-toggled resource monitor. "multithread" (rayon) is a default feature, so disable it.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
lto = true          # Cross-crate inlining + dead-code removal: smaller, faster binary
codegen-units = 1   # Better optimisation at the cost of longer release builds
panic = "abort"     # No unwinding tables/landing pads
strip = true        # Drop debug symbols from the shipped binary

[dev-dependencies]
criterion = "0.8.2"

[[bin]]
name = "benchmark_folder_close"
path = "benches/benchmark_folder_close.rs"
