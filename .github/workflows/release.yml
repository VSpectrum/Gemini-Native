name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: gemini_native_client-windows.zip
          - os: ubuntu-latest
            asset_name: gemini_native_client-linux.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller playwright gemini_webapi loguru

      - name: Bundle Python scripts
        run: |
          pyinstaller --onefile gemini_auto.py
          pyinstaller --onefile gemini_download.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          cp dist/gemini_auto.exe target/release/
          cp dist/gemini_download.exe target/release/
          cd target/release
          7z a ${{ matrix.asset_name }} gemini_native_client.exe gemini_auto.exe gemini_download.exe

      - name: Build and Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release
          cp dist/gemini_auto target/release/
          cp dist/gemini_download target/release/
          cd target/release
          zip -r ${{ matrix.asset_name }} gemini_native_client gemini_auto gemini_download

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.asset_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
