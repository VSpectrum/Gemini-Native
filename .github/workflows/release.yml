name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: gemini_native_client-macos.zip
          - os: windows-latest
            asset_name: gemini_native_client-windows.exe
          - os: ubuntu-latest
            asset_name: gemini_native_client-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          mv target/release/gemini_native_client.exe target/release/${{ matrix.asset_name }}

      - name: Build and bundle Mac App (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo install cargo-bundle
          cargo bundle --release
          cd target/release/bundle/osx/
          zip -r ../../../../target/release/${{ matrix.asset_name }} "Gemini Native Client.app"

      - name: Build release binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release
          mv target/release/gemini_native_client target/release/${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.asset_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
