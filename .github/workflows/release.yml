name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: gemini_native_client-windows.zip
          - os: ubuntu-latest
            asset_name: gemini_native_client-linux.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Test
        run: cargo test

      - name: Build and Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          cd target/release
          7z a ${{ matrix.asset_name }} gemini_native_client.exe gemini_reap.exe

      - name: Build and Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release
          cd target/release
          zip -r ${{ matrix.asset_name }} gemini_native_client gemini_reap

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.asset_name }}
          name: Release ${{ github.ref_name }}
        env:
          # Ephemeral token minted for this job. It is not a user session.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
